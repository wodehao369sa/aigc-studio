# Place this server block in the Nginx http context after defining an htpasswd file.
server {
    listen 8083 ssl;
    server_name _;
    ssl_certificate /etc/aigc-studio/certs/server.crt;
    ssl_certificate_key /etc/aigc-studio/certs/server.key;
    client_max_body_size 20m;
    access_log /var/log/nginx/aigc-studio.access.log;
    error_log /var/log/nginx/aigc-studio.error.log warn;

    # Basic Auth applies to every normal route and API endpoint.
    auth_basic "AIGC Studio";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Standalone Next.js does not package static output itself. Serve versioned
    # browser assets directly so first-time/mobile visits never receive CSS 404s.
    location ^~ /_next/static/ {
        alias /opt/aigc-studio/.next/standalone/.next/static/;
        auth_basic off;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Agnes can read only a random, expiring token. Do not log the token URL.
    location ^~ /api/reference/ {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Polling is invoked only by the local systemd timer, never by the public network.
    location = /api/internal/poll {
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Only the application may use X-Accel-Redirect to reach this path.
    location /_protected_media/ {
        internal;
        alias /var/lib/aigc-studio/media/;
    }
}
