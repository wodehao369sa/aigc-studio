# Agnes reference media endpoint. HTTP is intentionally limited to opaque,
# expiring token URLs because Agnes does not trust the self-signed HTTPS cert.
server {
    listen 80;
    server_name _;
    access_log off;
    location ^~ /api/reference/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /_protected_media/ {
        internal;
        alias /var/lib/aigc-studio/media/;
    }
    location / { return 404; }
}
