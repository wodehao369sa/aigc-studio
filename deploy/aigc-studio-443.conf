# Standard HTTPS entry used by external providers (Agnes rejects non-standard ports).
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/aigc-studio/certs/server.crt;
    ssl_certificate_key /etc/aigc-studio/certs/server.key;
    client_max_body_size 20m;
    access_log /var/log/nginx/aigc-studio-443.access.log;
    error_log /var/log/nginx/aigc-studio-443.error.log warn;

    auth_basic "AIGC Studio";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/reference/ {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/internal/poll {
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /_protected_media/ {
        internal;
        alias /var/lib/aigc-studio/media/;
    }
}
