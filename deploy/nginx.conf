# Place this server block in the Nginx http context after defining an htpasswd file.
server {
    listen 8083 ssl;
    server_name _;
    ssl_certificate /etc/aigc-studio/certs/server.crt;
    ssl_certificate_key /etc/aigc-studio/certs/server.key;
    client_max_body_size 20m;
    access_log /var/log/nginx/aigc-studio.access.log;
    error_log /var/log/nginx/aigc-studio.error.log warn;

    # Basic Auth applies to every normal route and API endpoint.
    auth_basic "AIGC Studio";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Agnes can read only a random, expiring token. Do not log the token URL.
    location ^~ /api/reference/ {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Polling is invoked only by the local machine, never by the public network.
    location = /api/internal/poll {
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
