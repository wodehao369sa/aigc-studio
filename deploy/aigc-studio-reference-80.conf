# Agnes reference media endpoint (optional, for video reference images).
#
# Agnes does not trust the self-signed HTTPS certificate, so video reference
# images (image-to-video / keyframe / reference) must be served over plain HTTP.
# HTTP is intentionally limited to opaque, expiring token URLs:
#   - 32-byte random token
#   - expires in 24h
#   - invalidated as soon as the task finishes
# Image-to-image does NOT need this endpoint: it sends Base64 data URIs.
server {
    listen 80;
    server_name _;
    access_log off;
    location ^~ /api/reference/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location / { return 404; }
}
